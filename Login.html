<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agriculture Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">

        <div class="login-box">

            <div class="logo">
                🌱
            </div>

            <h1>Deen Farm</h1>
            <p class="subtitle">Welcome to your agricultural community</p>

            <form>

                <!-- Email -->
                <div class="input-group">
                    <label for="email">Email Address</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <!-- Phone Number -->
                <div class="input-group">
                    <label for="phone">Phone Number</label>
                    <input 
                        type="tel" 
                        id="phone" 
                        name="phone"
                        placeholder="Enter your phone number"
                        required
                    >
                </div>

                <!-- Password -->
                <div class="input-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

            

                <!-- Login Button -->
                <button type="submit" class="login-btn">
                   <a>Login</a> 
                </button>

            </form>

            <p class="footer-text">
                Growing a better future together 🌾
            </p>

            <br> <br> <hr> <br> <br> 
            <div>

 <!-- Confirm Password -->
 <div class="Forgot-Password">
    <a href="Forgotpassword.html">Forgot-Password?</a>
    <nav class="nav">
        <div class="Createpassword">
            
        </div>
    </nav>
</div>
          
              
            </div>

        </div>

    </div>

</body>
</html>
