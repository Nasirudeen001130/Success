<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgriFarm - Create Account</title>
    <link rel="stylesheet" href="Createaccount.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="container">

        <!-- Left Agricultural Section -->
        <div class="agri-section">
            <div class="overlay"></div>

            <div class="agri-content">
                <div class="logo">
                    🌱 <span>AgriFarm</span>
                </div>

                <h1>Grow Your Future<br>With Agriculture</h1>

                <p>
                    Join our agricultural community and discover smarter
                    ways to grow, connect, and build a sustainable future.
                </p>
            </div>
        </div>

        <!-- Create Account Section -->
        <div class="form-section">

            <div class="form-container">

                <h2>Create Account</h2>

                <p class="subtitle">
                    Create your account to get started
                </p>

                <!-- Google Button -->
                <button class="google-btn">
                    <span class="google-icon">G</span>
                    Continue with Google
                </button>

                <div class="divider">
                    <span>OR</span>
                </div>

                <form>

                    <!-- Email -->
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >
                    </div>

                    <!-- Phone -->
                    <div class="input-group">
                        <label for="phone">Phone Number</label>
                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter your phone number"
                            required
                        >
                    </div>

                    <!-- Password -->
                    <div class="input-group">
                        <label for="password">Password</label>

                        <div class="password-box">
                            <input
                                type="password"
                                id="password"
                                placeholder="Create a password"
                                required
                            >

                            <button type="button" class="show-password"
                                    onclick="togglePassword('password', this)">
                                👁
                            </button>
                        </div>
                    </div>

                    <!-- Confirm Password -->
                    <div class="input-group">
                        <label for="confirm-password">Confirm Password</label>

                        <div class="password-box">
                            <input
                                type="password"
                                id="confirm-password"
                                placeholder="Confirm your password"
                                required
                            >

                            <button type="button" class="show-password"
                                    onclick="togglePassword('confirm-password', this)">
                                👁
                            </button>
                        </div>
                    </div>

                    <!-- Terms -->
                    <div class="terms">
                        <input type="checkbox" id="terms" required>

                        <label for="terms">
                            I agree to the
                            <a href="#">Terms & Conditions</a>
                            and
                            <a href="#">Privacy Policy</a>
                        </label>
                    </div>

                    <!-- Create Account -->
                    <button type="submit" class="create-btn">
                        Create Account
                    </button>

                </form>

                <p class="login-text">
                    Already have an account?
                    <a href="Login.html">Login</a>
                </p>

            </div>

        </div>

    </div>

    <script>
        function togglePassword(inputId, button) {
            const input = document.getElementById(inputId);

            if (input.type === "password") {
                input.type = "text";
                button.textContent = "🙈";
            } else {
                input.type = "password";
                button.textContent = "👁";
            }
        }
    </script>

</body>
</html>
